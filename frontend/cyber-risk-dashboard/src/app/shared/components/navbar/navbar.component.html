<div class="navbar">

    <!-- Left -->

    <div class="left">

        <div class="title-group">

            <h2>Digital Twin Cyber Risk Platform</h2>

            <span>
                Continuous Information Systems Auditing
            </span>

        </div>

    </div>

    <!-- Center -->

    <div class="center">

        <div class="search">

            <span class="search-icon">⌕</span>

            <input
                type="text"
                placeholder="Search assets, identities, vulnerabilities..." />

        </div>

    </div>

    <!-- Right -->

    <div class="right">

        <div class="status">

            <span class="status-dot"></span>

            <span>System Online</span>

        </div>

        <div class="date">

            {{ today | date:'EEE, dd MMM yyyy' }}

        </div>

        <button class="notification">

            🔔

        </button>

        <div class="profile">

            <div class="avatar">

                AI

            </div>

            <div>

                <strong>Administrator</strong>

                <small>Security Operations</small>

            </div>

        </div>

    </div>

</div>
