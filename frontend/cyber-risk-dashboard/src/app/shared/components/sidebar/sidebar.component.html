<div class="sidebar">

    <!-- Brand -->

    <div class="brand">

        <div class="brand-icon">

            <lucide-angular
                [img]="ShieldCheck"
                size="28">
            </lucide-angular>

        </div>

        <div>

            <h2>CyRiAs</h2>

            <span>Digital Twin Platform</span>

        </div>

    </div>

    <!-- Navigation -->

    <nav>

        <a
            routerLink="/"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }">

            <div class="icon">

                <lucide-angular
                    [img]="LayoutDashboard"
                    size="20">
                </lucide-angular>

            </div>

            <span>Dashboard</span>

        </a>

        <a
            routerLink="/asset-discovery"
            routerLinkActive="active">

            <div class="icon">

                <lucide-angular
                    [img]="Server"
                    size="20">
                </lucide-angular>

            </div>

            <span>Assets</span>

        </a>

        <a
            routerLink="/digital-twin"
            routerLinkActive="active">

            <div class="icon">

                <lucide-angular
                    [img]="Network"
                    size="20">
                </lucide-angular>

            </div>

            <span>Digital Twin</span>

        </a>

        <a
            routerLink="/knowledge-graph"
            routerLinkActive="active">

            <div class="icon">

                <lucide-angular
                    [img]="Share2"
                    size="20">
                </lucide-angular>

            </div>

            <span>Knowledge Graph</span>

        </a>

        <a
            routerLink="/predictive-risk"
            routerLinkActive="active">

            <div class="icon">

                <lucide-angular
                    [img]="TrendingUp"
                    size="20">
                </lucide-angular>

            </div>

            <span>Predictive Risk</span>

        </a>

        <a
            routerLink="/attack-path"
            routerLinkActive="active">

            <div class="icon">

                <lucide-angular
                    [img]="ShieldAlert"
                    size="20">
                </lucide-angular>

            </div>

            <span>Attack Path</span>

        </a>

        <a
            routerLink="/cloud"
            routerLinkActive="active">

            <div class="icon">

                <lucide-angular
                    [img]="Cloud"
                    size="20">
                </lucide-angular>

            </div>

            <span>Cloud</span>

        </a>

        <a
            routerLink="/identity"
            routerLinkActive="active">

            <div class="icon">

                <lucide-angular
                    [img]="Users"
                    size="20">
                </lucide-angular>

            </div>

            <span>Identity</span>

        </a>

        <a
            routerLink="/configuration"
            routerLinkActive="active">

            <div class="icon">

                <lucide-angular
                    [img]="Settings"
                    size="20">
                </lucide-angular>

            </div>

            <span>Configuration</span>

        </a>

        <a
            routerLink="/logs"
            routerLinkActive="active">

            <div class="icon">

                <lucide-angular
                    [img]="ScrollText"
                    size="20">
                </lucide-angular>

            </div>

            <span>Logs</span>

        </a>

    </nav>


</div>
